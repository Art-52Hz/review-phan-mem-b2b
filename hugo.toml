baseURL = 'https://aiprofreelancer.com/'
languageCode = 'en-us'
title = 'AI Pro Freelancer'
theme = "PaperMod"
googleAnalytics = "G-FHNLXVNY7R"
enableRobotsTXT = true

[params]
  mainSections = ["posts"]
  description = "Honest reviews of B2B software, SaaS tools, and AI products to help freelancers and businesses make smarter decisions."
  author = "Vincent Phạm"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  defaultTheme = "auto"
  googleSiteVerification = "6zx8ayAQl6MTjYDpIFX7IkNt-IvRhtmUyGGvFeiFVpI"

  [params.label]
    text = "AI Pro Freelancer"
    icon = "/images/logo-mark.svg"
    iconHeight = 30

  [params.homeInfoParams]
    Title = "Know the real price **before** you buy that VPS or AI tool"
    Subtitle = "Plain-English reviews and side-by-side comparisons of VPS hosting, AI voice, trading and SEO tools — with the renewal price, the limits and who each plan actually fits."

