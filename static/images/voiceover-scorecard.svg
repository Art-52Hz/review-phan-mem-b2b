<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Voiceover evaluation scorecard</title><desc id="desc">A workflow from a shared script through listening and revision to a rights and export check.</desc>
<rect width="1200" height="630" fill="#102232"/><rect x="64" y="66" width="8" height="74" fill="#ffb347"/>
<g fill="#fff" font-family="Arial,sans-serif"><text x="96" y="99" font-size="24" letter-spacing="3">AIPROFREELANCER</text><text x="64" y="217" font-size="66" font-weight="700">A voice worth delivering?</text><text x="64" y="273" font-size="30" fill="#b9d4e0">Use the same script. Record the evidence.</text></g>
<g font-family="Arial,sans-serif" font-size="27" font-weight="700"><rect x="64" y="347" width="318" height="137" rx="16" fill="#1d4356"/><text x="89" y="402" fill="#64d9dd">01 / LISTEN</text><text x="89" y="447" fill="#fff">Names · pacing · tone</text><rect x="410" y="347" width="318" height="137" rx="16" fill="#1d4356"/><text x="435" y="402" fill="#64d9dd">02 / REVISE</text><text x="435" y="447" fill="#fff">Time · credits · edits</text><rect x="756" y="347" width="380" height="137" rx="16" fill="#ffb347"/><text x="781" y="402" fill="#102232">03 / CHECK RIGHTS</text><text x="781" y="447" fill="#102232">License · consent · export</text></g>
<text x="64" y="564" fill="#b9d4e0" font-family="Arial,sans-serif" font-size="23">Free evaluation template • No invented benchmark scores</text></svg>
