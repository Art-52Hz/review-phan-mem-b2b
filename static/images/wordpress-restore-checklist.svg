<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Test restoration before relying on a backup.</title>
<desc id="desc">WordPress hosting questions: does the software fit, can a backup restore the site, and who resolves failures?</desc>
<rect width="1200" height="630" fill="#f2eddf"/>
<path d="M900 0H1200V630H1050Z" fill="#e4ddcb"/>
<g font-family="Georgia,serif" fill="#182d28">
<text x="62" y="152" font-size="73" font-weight="bold">Restore it before</text>
<text x="62" y="235" font-size="73" font-weight="bold">you rely on it.</text>
</g>
<g font-family="Trebuchet MS,sans-serif">
<text x="65" y="61" fill="#52665a" font-size="21" letter-spacing="3">WORDPRESS HOSTING / 03 CHECKS</text>
<rect x="832" y="87" width="305" height="151" fill="#c4e14f"/>
<text x="856" y="129" font-size="19" font-weight="bold" fill="#182d28">BEFORE YOU BUY</text>
<text x="856" y="175" font-size="27" fill="#182d28">Check the full site.</text>
<text x="856" y="212" font-size="27" fill="#182d28">Record the recovery.</text>
<path d="M63 290H1137" stroke="#182d28" stroke-width="3"/>
<g fill="#182d28"><rect x="63" y="321" width="338" height="206"/><rect x="431" y="321" width="338" height="206"/><rect x="799" y="321" width="338" height="206"/></g>
<g fill="#c4e14f" font-size="25"><text x="89" y="365">01 / COMPATIBILITY</text><text x="457" y="365">02 / RESTORATION</text><text x="825" y="365">03 / RESPONSIBILITY</text></g>
<g fill="#f2eddf" font-size="35" font-weight="bold"><text x="89" y="420">Does it fit?</text><text x="457" y="420">Can it restore?</text><text x="825" y="420">Who fixes it?</text></g>
<g fill="#c6d2c3" font-size="23"><text x="89" y="465">Stack, plugins, integrations.</text><text x="457" y="465">Files, database, user flows.</text><text x="825" y="465">Support scope, escalation.</text></g>
<text x="63" y="582" font-size="24" font-weight="bold" fill="#182d28">AIProFreelancer</text>
<text x="1137" y="582" text-anchor="end" font-size="20" fill="#52665a">A backup file is not a recovery test.</text>
</g></svg>
