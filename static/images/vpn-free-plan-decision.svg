<text x="679" y="480" fill="#fff4dd" font-family="Georgia,serif" font-size="35">An unmet requirement?</text>
<text x="679" y="526" fill="#fff4dd" font-family="Trebuchet MS,sans-serif" font-size="22">Verify the plan before paying.</text>
<circle cx="1053" cy="193" r="68" fill="none" stroke="#d95636" stroke-width="3"/>
<text x="1018" y="216" fill="#d95636" font-family="Georgia,serif" font-size="68">?</text>
